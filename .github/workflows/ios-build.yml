# iPhone アプリのビルド(Mac)。署名はしないので、Apple のアカウントがなくても動く。
# コンパイルが通るかを確かめる。TestFlight への送信は、Apple Developer Program の登録の後に加える。
name: ios-build

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

# 公開リポジトリなので、Actions が使える権限は読み取りだけにする
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen
          command -v pod || sudo gem install cocoapods
          pod --version
      - name: MediaPipe models and fonts
        run: |
          ios/App/scripts/fetch-models.sh
          ios/App/scripts/fetch-fonts.sh
      - name: Generate the Xcode project
        working-directory: ios/App
        run: |
          # スマホ制限の拡張(restriction.yml)も含めて、コンパイルが通るかを確かめる
          TK_RESTRICTION=YES xcodegen generate
          pod install
      - name: Build for iPhone (no signing)
        working-directory: ios/App
        run: |
          xcodebuild -quiet \
            -workspace StudyApp.xcworkspace -scheme StudyApp -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            build
      - name: Restriction extensions are embedded
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphoneos/StudyApp.app"
          ls "$APP/PlugIns"
          for ext in TKShieldConfiguration TKShieldAction TKMonitor; do
            test -d "$APP/PlugIns/$ext.appex"
            /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APP/PlugIns/$ext.appex/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/PlugIns/$ext.appex/Info.plist"
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :TKRestrictionEnabled' "$APP/Info.plist")" = "YES"
          /usr/libexec/PlistBuddy -c 'Print :TKAppGroup' "$APP/Info.plist"
      - name: Podfile.lock
        if: always()
        working-directory: ios/App
        run: cat Podfile.lock || true
