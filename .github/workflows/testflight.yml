# TestFlight に送る(MVP の設計 10 章、決定事項 D-16)。Mac の実行環境で、署名して App Store Connect に送る。
#
# 送るとき:tag `testflight-*` を push する(Claude Code が行う)か、Actions の画面で「Run workflow」を押す。
# このファイルや署名のスクリプトを変えたときは、送らずに Release のビルドだけを確かめる(dry run)。
#
# 使う Secrets(リポジトリの Settings → Secrets and variables → Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY(.p8 の中身), APPLE_TEAM_ID
# 使う Variables:BUNDLE_ID(なければ仮の com.example.studyapp)、
#   TK_RESTRICTION(スマホ制限の拡張を含めるか。Apple の Family Controls の許可が下りてから YES にする。なければ NO)
# Secrets がまだないときも、dry run として Release のビルドまで行う。
name: testflight

on:
  workflow_dispatch:
  push:
    tags:
      - 'testflight-*'
    branches:
      - main
      - 'claude/**'
    paths:
      - '.github/workflows/testflight.yml'
      - 'ios/App/scripts/asc_signing.py'
      - 'ios/App/project.yml'
      - 'ios/App/restriction.yml'
      - 'ios/App/Config/**'
      - 'ios/App/Podfile'

# 公開リポジトリなので、Actions が使える権限は読み取りだけにする
permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.example.studyapp' }}
      TK_RESTRICTION: ${{ vars.TK_RESTRICTION || 'NO' }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Decide whether to upload
        id: mode
        env:
          HAS_KEY: ${{ secrets.ASC_PRIVATE_KEY != '' }}
        run: |
          upload=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [[ "$GITHUB_REF" == refs/tags/testflight-* ]]; then
            if [ "$HAS_KEY" = "true" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
              upload=true
            else
              echo "::warning::Secrets(ASC_KEY_ID・ASC_ISSUER_ID・ASC_PRIVATE_KEY・APPLE_TEAM_ID)がそろっていないので、送らずにビルドだけ行います"
            fi
          fi
          echo "upload=$upload" >> "$GITHUB_OUTPUT"
          echo "送る:$upload、Bundle ID:$BUNDLE_ID、ビルド番号:$BUILD_NUMBER、スマホ制限:$TK_RESTRICTION"

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen
          command -v pod || sudo gem install cocoapods
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" ios/App/scripts/asc_signing.py self-test

      - name: MediaPipe models and fonts
        run: |
          ios/App/scripts/fetch-models.sh
          ios/App/scripts/fetch-fonts.sh

      - name: Signing identity and profile
        id: signing
        if: steps.mode.outputs.upload == 'true'
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          umask 077
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$ASC_KEY_PATH"
          # スマホ制限を含めるときは、3 つの拡張も署名する(Bundle ID はアプリの後ろにつける)
          EXTENSIONS=""
          if [ "$TK_RESTRICTION" = "YES" ]; then EXTENSIONS="ShieldConfiguration,ShieldAction,Monitor"; fi
          "$RUNNER_TEMP/venv/bin/python" ios/App/scripts/asc_signing.py create --bundle-id "$BUNDLE_ID" --extensions "$EXTENSIONS" --out "$RUNNER_TEMP/signing"

          # この実行だけで使うキーチェーンに、証明書を入れる
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(uuidgen)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KC" -A || true
          security import "$RUNNER_TEMP/signing/distribution.p12" -k "$KC" -f pkcs12 -A \
            -P "$(cat "$RUNNER_TEMP/signing/p12-password")" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"

          # プロファイルを、Xcode が探す場所に置く
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/signing/"*.mobileprovision "$dir/"
          done

          # 署名の設定(Config/Base.xcconfig が読み込む。アプリと拡張に効く。リポジトリには入れない)
          cat > ios/App/Config/Signing.xcconfig <<EOF
          DEVELOPMENT_TEAM = $APPLE_TEAM_ID
          TK_BASE_BUNDLE_ID = $BUNDLE_ID
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          EOF
          cat "$RUNNER_TEMP/signing/profiles.xcconfig" >> ios/App/Config/Signing.xcconfig
          cat ios/App/Config/Signing.xcconfig

      - name: Generate the Xcode project
        working-directory: ios/App
        run: |
          # TK_RESTRICTION が YES のときだけ、スマホ制限の拡張(restriction.yml)を含める
          xcodegen generate
          pod install

      - name: Archive (signed)
        if: steps.mode.outputs.upload == 'true'
        working-directory: ios/App
        run: |
          xcodebuild -quiet \
            -workspace StudyApp.xcworkspace -scheme StudyApp -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StudyApp.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Upload to App Store Connect
        if: steps.mode.outputs.upload == 'true'
        run: |
          # Bundle ID ごとのプロファイル(アプリと、スマホ制限の拡張)
          PROFILES=$(python3 -c 'import json,sys; print("".join(f"<key>{k}</key><string>{v}</string>" for k, v in json.load(open(sys.argv[1])).items()))' "$RUNNER_TEMP/signing/export-profiles.json")
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>$PROFILES</dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StudyApp.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          {
            echo "### TestFlight に送りました"
            echo "- Bundle ID:$BUNDLE_ID"
            echo "- ビルド番号:$BUILD_NUMBER"
            echo "- スマホ制限の拡張:$TK_RESTRICTION"
            echo "- App Store Connect の処理が終わると(10〜30 分ほど)、TestFlight に出ます"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive (dry run, no signing)
        if: steps.mode.outputs.upload != 'true'
        working-directory: ios/App
        run: |
          xcodebuild -quiet \
            -workspace StudyApp.xcworkspace -scheme StudyApp -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StudyApp.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" CODE_SIGNING_ALLOWED=NO \
            archive
          APP="$RUNNER_TEMP/StudyApp.xcarchive/Products/Applications/StudyApp.app"
          # 送るときに App Store Connect が確かめる項目を、ここでも見ておく
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :TKRestrictionEnabled' "$APP/Info.plist")" = "$TK_RESTRICTION"
          if [ "$TK_RESTRICTION" = "YES" ]; then ls "$APP/PlugIns"; else test ! -d "$APP/PlugIns"; fi
          echo "### dry run:送らずに Release のビルドまで行いました(スマホ制限の拡張:$TK_RESTRICTION)" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up the keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/signing" ios/App/Config/Signing.xcconfig
