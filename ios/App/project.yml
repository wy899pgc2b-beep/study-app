# Xcode のプロジェクトの設定。`xcodegen generate` で StudyApp.xcodeproj を作る(作ったものはリポジトリに入れない)。
name: StudyApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # CocoaPods の組み込みの処理が、Xcode の既定の制限(スクリプトの隔離)で止まらないようにする
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  StudyCore:
    path: ../StudyCore
targets:
  StudyApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # MediaPipe のモデル(scripts/fetch-models.sh で取ってくる。リポジトリには入れない)
      - path: Resources/Models
        type: folder
        buildPhase: resources
    dependencies:
      - package: StudyCore
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "ツクエログ"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "学習中の様子を、この iPhone の中だけで解析するために使います。映像は保存も送信もしません。"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # 仮の Bundle ID(利用者に決めてもらったら差し替える)
        PRODUCT_BUNDLE_IDENTIFIER: com.example.studyapp
        TARGETED_DEVICE_FAMILY: "1"
    scheme: {}
