# Xcode のプロジェクトの設定。`xcodegen generate` で StudyApp.xcodeproj を作る(作ったものはリポジトリに入れない)。
name: StudyApp
# スマホ制限の拡張と権限(Apple の許可が下りてから。TK_RESTRICTION=YES xcodegen generate)
include:
  - path: restriction.yml
    enable: ${TK_RESTRICTION}
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # CocoaPods の組み込みの処理が、Xcode の既定の制限(スクリプトの隔離)で止まらないようにする
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  StudyCore:
    path: ../StudyCore
  # 端末の DB(SQLite)
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
targets:
  StudyApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # スマホ制限で、アプリと拡張が共有するもの
      - path: Restriction
      # MediaPipe のモデル(scripts/fetch-models.sh で取ってくる。リポジトリには入れない)
      - path: Resources/Models
        type: folder
        buildPhase: resources
      # 画面の文字(scripts/fetch-fonts.sh で取ってくる。SIL Open Font License)
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      # アプリのアイコン(仮)
      - path: Resources/Assets.xcassets
      # プライバシーの申告
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: StudyCore
      - package: StudyCore
        product: RestrictionCore
      - package: GRDB
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "ツクエログ"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: "学習中の様子を、この iPhone の中だけで解析するために使います。映像は保存も送信もしません。"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIAppFonts:
          - Fonts/ZenMaruGothic-Regular.ttf
          - Fonts/ZenMaruGothic-Medium.ttf
          - Fonts/ZenMaruGothic-Bold.ttf
        ITSAppUsesNonExemptEncryption: false
        # スマホ制限:拡張と共有する App Group と、Apple の許可を得たビルドか
        TKAppGroup: "$(TK_APP_GROUP)"
        TKRestrictionEnabled: "$(TK_RESTRICTION_ENABLED)"
    # 版・Bundle ID・署名は xcconfig に置く(ここに書くと xcconfig より優先されてしまう)
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
